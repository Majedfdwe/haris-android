                  btn("حفظ إعدادات تيليجرام") { saveCfg() }
                  btn("إرسال رسالة تجربة") { testMsg() }
                  btn("1. تفعيل صلاحية المراقبة") { askAdmin() }
                  btn("2. تشغيل الحماية") { start() }
                  btn("تحديث") { refresh() }

                  val inviteTitle = TextView(this)
                  inviteTitle.text = "ادعُ أصدقاءك"
                  inviteTitle.textSize = 18f
                  inviteTitle.setTextColor(0xFFFFFFFF.toInt())
                  inviteTitle.setPadding(0, 48, 0, 8)
                  root.addView(inviteTitle)

                  inviteInfo = TextView(this)
                  inviteInfo.setTextColor(0xFFCBD5E1.toInt())
                  inviteInfo.textSize = 15f
                  inviteInfo.text = "رمز دعوتك: " + Invite.myCode(this)
                  root.addView(inviteInfo)

                  btn("مشاركة رابط الدعوة") { shareInvite() }
                  btn("تحديث عدد المسجّلين") { showCount() }
                  inviterBox = field("رمز دعوة من صديق (اختياري)")
                  btn("تسجيل رمز الدعوة") { claimCode() }
                  btn("عن المطوّر") { showAbout() }

                  list = LinearLayout(this)
                  list.orientation = LinearLayout.VERTICAL
                  root.addView(list)

                  val sv = ScrollView(this)
                  sv.addView(root)
                  setContentView(sv)
              }

              private fun shareInvite() {
                  val i = Intent(Intent.ACTION_SEND)
                  i.type = "text/plain"
                  i.putExtra(Intent.EXTRA_TEXT, "جرّب تطبيق حارس الهاتف، يصوّر من يحاول فتح هاتفك برمز خاطئ:\n" + Invite.LINK + "\nرمز دعوتي: " + Invite.myCode(this) + "\nأدخله داخل التطبيق بعد التثبيت.")
                  startActivity(Intent.createChooser(i, "مشاركة"))
              }

              private fun showCount() {
                  val ctx = applicationContext
                  Thread {
                      val n = Invite.count(ctx)
                      runOnUiThread {
                          inviteInfo.text = "رمز دعوتك: " + Invite.myCode(ctx) + "\nعدد من سجّلوا برمزك: " + n
                      }
                  }.start()
              }

              private fun claimCode() {
                  val ctx = applicationContext
                  val code = inviterBox.text.toString()
                  Thread {
                      val r = Invite.claim(ctx, code)
                      runOnUiThread {
                          Toast.makeText(this, r, Toast.LENGTH_LONG).show()
                          if (r.startsWith("تم")) inviterBox.setText("")
                      }
                  }.start()
              }

              private fun showAbout() {
                  AlertDialog.Builder(this)
                      .setTitle(About.TITLE)
                      .setMessage(About.TEXT)
                      .setPositiveButton("إغلاق", null)
                      .show()
              }

              private fun saveCfg() {
                  Uploader.save(this, tokenBox.text.toString(), chatBox.text.toString())
                  tokenBox.setText("")
                  Toast.makeText(this, "تم الحفظ", Toast.LENGTH_SHORT).show()
                  refresh()
              }

              private fun testMsg() {
                  val ctx = applicationContext
                  Thread {
                      val r = Uploader.sendText(ctx, "رسالة تجربة من حارس الهاتف")
                      runOnUiThread {
                          val m = if (r == "ok") "وصلت الرسالة، افتح تيليجرام" else r
                          Toast.makeText(this, m, Toast.LENGTH_LONG).show()
                      }
                  }.start()
              }

              private fun askAdmin() {
                  val i = Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN)
                  i.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, comp())
                  i.putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION, "لالتقاط صورة عند إدخال رمز قفل خاطئ")
                  startActivity(i)
              }

              private fun start() {
                  val need = mutableListOf(Manifest.permission.CAMERA)
                  if (Build.VERSION.SDK_INT >= 33) need.add(Manifest.permission.POST_NOTIFICATIONS)
                  if (need.any { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }) {
                      requestPermissions(need.toTypedArray(), 1)
                  } else {
                      launch()
                  }
              }

              private fun launch() {
                  startForegroundService(Intent(this, GuardService::class.java))
                  refresh()
              }

              override fun onRequestPermissionsResult(rc: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(rc, p, r)
                  if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) launch()
              }

              private fun refresh() {
                  val dpm = getSystemService(DevicePolicyManager::class.java)
                  val admin = dpm.isAdminActive(comp())
                  val on = GuardService.instance != null
                  val tg = Uploader.token(this).isNotBlank()
                  status.text = "صلاحية المراقبة: " + (if (admin) "مفعّلة" else "غير مفعّلة") +
                      "\nالحماية: " + (if (on) "تعمل" else "متوقفة") +
                      "\nتيليجرام: " + (if (tg && Uploader.chatId(this).isNotBlank()) "جاهز" else "أكمل التوكن ورقم المحادثة") +
                      "\n\nالسجل:\n" + PhotoStore.lastLog(this)
                  list.removeAllViews()
                  val files = PhotoStore.dir(this).listFiles()?.sortedByDescending { it.lastModified() }?.take(20)
                  files?.forEach { f ->
                      val iv = ImageView(this)
                      val o = BitmapFactory.Options()
                      o.inSampleSize = 2
                      iv.setImageBitmap(BitmapFactory.decodeFile(f.path, o))
                      iv.adjustViewBounds = true
                      iv.setPadding(0, 24, 0, 0)
                      list.addView(iv)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
                  Uploader.flush(applicationContext)
                  showCount()
              }
          }
          EOF

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: haris-v5-apk
          path: app/build/outputs/apk/debug/app-debug.apk
