          cat > app/src/main/java/com/haris/guard/MainActivity.kt <<'EOF'
          package com.haris.guard

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.BitmapFactory
          import android.os.Build
          import android.os.Bundle
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private lateinit var status: TextView
              private lateinit var list: LinearLayout
              private lateinit var root: LinearLayout
              private lateinit var tokenBox: EditText
              private lateinit var chatBox: EditText
              private lateinit var inviterBox: EditText
              private lateinit var inviteInfo: TextView

              private fun comp() = ComponentName(this, AdminReceiver::class.java)

              private fun btn(t: String, f: () -> Unit) {
                  val bt = Button(this)
                  bt.text = t
                  bt.setOnClickListener { f() }
                  root.addView(bt)
              }

              private fun field(hint: String): EditText {
                  val e = EditText(this)
                  e.hint = hint
                  e.setTextColor(0xFFFFFFFF.toInt())
                  e.setHintTextColor(0xFF94A3B8.toInt())
                  e.setSingleLine(true)
                  e.textDirection = View.TEXT_DIRECTION_LTR
                  root.addView(e)
                  return e
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(40, 80, 40, 40)
                  root.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  root.setBackgroundColor(0xFF0B1220.toInt())

                  val title = TextView(this)
                  title.text = "حارس الهاتف"
                  title.textSize = 24f
                  title.setTextColor(0xFFFFFFFF.toInt())
                  root.addView(title)

                  status = TextView(this)
                  status.setTextColor(0xFFCBD5E1.toInt())
                  status.textSize = 15f
                  root.addView(status)

                  val help = TextView(this)
                  help.text = "قبل البدء (مرة واحدة):\n1. افتح تيليجرام وابحث عن @BotFather ثم أرسل /newbot واتبع الخطوات لتحصل على التوكن.\n2. ابحث عن @userinfobot وأرسل له أي رسالة ليعطيك رقم محادثتك.\n3. افتح بوتك الجديد واضغط Start.\n4. الصق التوكن والرقم في الخانتين أدناه ثم اضغط حفظ."
                  help.setTextColor(0xFF94A3B8.toInt())
                  help.textSize = 13f
                  help.setPadding(0, 24, 0, 24)
                  root.addView(help)

                  tokenBox = field("الصق التوكن هنا")
                  chatBox = field("رقم المحادثة (Chat ID)")
